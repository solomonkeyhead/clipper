[project]
name = "clipper"
version = "0.1.0"
description = "Automated short-form clipping tool: long video in, ranked vertical clips out."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    # CLI + config
    "typer>=0.19",
    "rich>=14.0",
    "pydantic>=2.11",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.1",
    # numerics
    "numpy>=2.1",
    "scipy>=1.15",
    "pandas>=2.2",
    # media
    "faster-whisper>=1.2.1",
    "yt-dlp>=2025.1.1",
    "soundfile>=0.13",
    "opencv-python-headless>=4.11",
    # llm backends
    "google-genai>=1.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.49"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.125",
    "ruff>=0.9",
]

[project.scripts]
clipper = "clipper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a few seconds (render / transcribe / network)",
    "gpu: requires a working CUDA GPU",
    "network: requires internet access",
]
filterwarnings = ["ignore::DeprecationWarning"]
