# Global pipeline tuning. Campaign rules live in campaigns/<name>.yaml.
# Every key here is validated by clipper.config.Config -- unknown keys are an error.

transcription:
  model: large-v3            # distil-large-v3 (English-only, ~2x faster) or medium if slow
  compute_type: float16      # falls back to int8_float16 automatically on CUDA OOM
  device: auto               # auto = cuda when CTranslate2 sees a GPU, else cpu
  language: auto             # or "en" to skip language detection
  vad_filter: true
  beam_size: 5
  chunk_seconds: 3600        # sources longer than this are transcribed in chunks

candidates:
  min_seconds: 20
  max_seconds: 55
  target_seconds: [25, 45]
  max_candidates: 60
  min_gap_seconds: 30        # between selected clips
  max_silence_ratio: 0.25    # hard filter before scoring
  edge_trim_seconds: 20      # ignore the first/last N seconds of the source...
  edge_trim_min_source_seconds: 300   # ...unless the source is shorter than this
  dedupe_iou: 0.8

weights:                     # renormalized over whichever signals are available
  llm: 0.50
  heatmap: 0.20
  audio: 0.15
  text: 0.15

selection:
  top_n: 5
  min_composite: 0.15        # relative tail guard only; the real gate is min_llm_total
  max_from_same_third: 3     # spread picks across the video
  # The absolute quality gate, on the raw 0-10 rubric scale. This is what lets
  # clipper return two clips, or none, when a source is weak -- a threshold on
  # the percentile composite cannot, because percentiles are uniform within
  # every video by construction. See PLAN.md P1 and docs/DECISIONS.md D14.
  min_llm_total: 5.5
  use_absolute_gate: true    # false restores the brief's percentile-only behaviour

llm:
  backend: gemini            # gemini | ollama | anthropic | mock
  model: null                # null = resolve the best available free model at runtime
  batch_size: 15             # candidates per call (8 took twice the calls; D75)
  max_retries: 5
  temperature: 0.2
  requests_per_minute: 10    # client-side limiter; keep under the free-tier RPM
  use_second_opinion: true   # prompt B; disabling halves LLM calls
  disagreement_penalty: 0.25
  correct_captions: true     # fix misheard caption words from context (sound-alike swaps only)
  # Tried first to propose caption fixes; the scoring model is the fallback and always
  # does the verification. Free tier, verified 2026-09-22: 20 requests/day for this
  # model (quota GenerateRequestsPerDayPerProjectPerModel-FreeTier), one per clip, and
  # often overloaded -- past the quota or the timeout it just falls back. null = off.
  correction_model: gemini-3-flash-preview
  correction_timeout: 30   # seconds before giving up on correction_model and falling back
  # Create's writer, diagram planner, physics check and footage judge, tried first (D109).
  # Claude, billed per use (about $0.30-0.60 a video), and only when ANTHROPIC_API_KEY is in
  # .env; Gemini is the fallback. null = Create uses the free models only.
  create_model: claude-opus-5-5
  # No API key? Then Claude Code (if installed and logged in) runs it on your Claude plan:
  # free per call, counts toward the plan's usage limits (D113). false = API key only.
  create_via_claude_plan: true
  # The footage judge, ~9 small calls a video: Sonnet, to spare the plan's usage (D116).
  create_quick_model: claude-sonnet-5-5
  # Claude set up but out of usage? Stop and say so, rather than let Gemini make it (D117).
  create_claude_only: true
  # Create jobs Gemini does first (free key), Claude only if it can't answer (D136): script (writing
  # and re-planning), check (physics), review (sketch look-and-fix), footage (judging stock clips).
  # Drawing the sketches stays with Claude. Remove a name to give that job back to Claude.
  create_gemini_jobs: [script, check, review, footage]
  # The Gemini models Create asks, best first, each tried when the one before is busy (D162). All free on a
  # Gemini key (checked 2026-10-08). The lite models are left out: their drawings came back broken.
  create_gemini_models: [gemini-3.8-flash, gemini-3.7-flash, gemini-3.5-flash, gemini-flash-latest]
  # More free models, asked after Gemini in this order, each only when its free key is in .env (D164):
  # MISTRAL_API_KEY (console.mistral.ai), GROQ_API_KEY (console.groq.com), NVIDIA_API_KEY
  # (build.nvidia.com), OPENROUTER_API_KEY (openrouter.ai). Change a model name here if one is retired.
  create_free_models:
    mistral: mistral-medium-latest
    groq: openai/gpt-oss-120b
    nvidia: openai/gpt-oss-120b
    openrouter: openrouter/free
  # Jobs the paid Claude API key (ANTHROPIC_API_KEY, billed per use) may do (D142): only drawing
  # the sketches. Every other job runs on your Claude plan through Claude Code, or on Gemini,
  # even with a key set. Add names (judge, script, check, review, footage, place, topics) to allow more.
  paid_api_jobs: [sketch]
  # Caption fixes ruled wrong on review ("heard -> replacement"); never applied again.
  # Every applied fix is listed per clip in report.md -- add a bad one in your own data/config.yaml.
  rejected_caption_fixes: []
  # Who judges the moments and picks each clip's opening line (D139). Flash-lite judged Love and
  # Justice EP1 and all 9 clips were rated 1 star (weak hook, boring). Claude, by API key or on
  # your Claude plan (counts toward its usage, about 10 calls a video); Gemini still watches the
  # video and is the fallback. null = the free Gemini models judge.
  judge_model: claude-opus-5-5
  use_few_shot_examples: false
  few_shot_count: 3
  rubric_weights:
    hook_strength: 0.30
    standalone_clarity: 0.20
    payoff: 0.20
    emotional_intensity: 0.15
    quotability: 0.10
    ending_completeness: 0.05

render:
  width: 1080
  height: 1920
  fps: 30
  encoder: auto              # auto = h264_nvenc if it actually works, else libx264
  x264_preset: veryfast
  crf: 20
  nvenc_cq: 23
  audio_bitrate: 192k
  audio_rate: 48000
  loudness_lufs: -14
  true_peak_dbtp: -1.5
  caption_style: bold_pop
  caption_font: Inter
  show_hook_text: true
  hook_text_seconds: 3.5       # the most; each hook shows max(2.5, 0.3 s/word + 0.8)
  safe_area:                 # keep text clear of TikTok/Reels/Shorts UI (D59)
    top: 300                   # hook band starts here (y 300-560)
    bottom: 680                # captions end by y=1240: username/description below
    side: 120
    right: 300                 # the like/comment/share rail, below y=840
  face_sample_fps: 5.0
  detect_screen_share: true  # stack content over the speaker for screen-share sources
  content_pane_share: 0.58   # target share of height for the content pane
  min_subject_face_ratio: 0.13  # smaller faces are overlays, not the subject
  per_shot_framing: true     # frame each shot separately, cutting where the source cuts
  min_shot_seconds: 1.5      # shorter shots merge into a neighbour
  max_shots: 8               # cap on separately-framed shots per clip
  draft_width: 540
  draft_height: 960

refine:
  pre_roll: 0.15
  post_roll: 0.35
  filler_window: 1.5         # trim leading filler inside this many seconds
  max_extend_seconds: 8.0    # extend to finish an unfinished closing thought

qa:
  min_face_ratio: 0.5        # only enforced for face-centric layouts
  # Looser than candidates.max_silence_ratio on purpose: that one estimates
  # silence from word-timing gaps, this one measures acoustic silence in the
  # rendered audio, which reads ~8 points higher on the same clip.
  max_silence_ratio: 0.35
  silence_min_gap: 0.5       # shorter gaps are speech rhythm, not dead air
  max_black_seconds: 0.3
  # A stalled render freezes for a large fraction of the clip (fail); a held
  # shot or a slide is merely still (warn).
  max_freeze_ratio: 0.30
  max_freeze_seconds: 3.0
  freeze_min_duration: 1.0
  min_lufs: -18
  max_lufs: -11
  max_true_peak_dbtp: -0.5
  max_lead_silence: 0.3
  max_trail_silence: 1.5
  caption_sync_tolerance: 0.25

# Campaign watcher (`clipper watch`): reads forwarded Vyro/Whop campaign emails
# from a dedicated mailbox and pushes the ones that fit to your phone via ntfy.
# Mailbox login and the ntfy topic are secrets and live in .env.
watch:
  imap_host: imap.gmail.com
  folders: ["INBOX", "[Gmail]/Spam"]
  lookback_days: 14
  # Who the campaigns are for; the judge reads it. Set yours in Settings (or data/config.yaml).
  profile: >-
    A social-media clipping account that cuts short vertical clips from footage it
    is authorized to use. Not interested in product ads, supplements, AI tools,
    crypto or gambling.
  platforms: ["tiktok"]
  min_rate_per_1k: 1.0       # skip campaigns paying less per 1,000 views
  notify_maybe: true         # also push "maybe" fits, marked with a ?
  ntfy_server: https://ntfy.sh
