# Vyro campaign "FX: Adults | S2" -- $2,000 per 1M views, TikTok only.
name: fx-adults-s2
title: FX Adults S2
marketplace: Vyro

# From the campaign brief (Terms and Conditions): FX grants "a limited,
# revocable, non-exclusive, non-transferable, non-sublicensable license to
# create a derivative work using the FX Content ... for the sole purpose of
# creating such work within, and during the term of, this Campaign". Clips are a
# work made-for-hire for FX. Source limited to the provided "Adults (Edited)"
# folder (f.io/a-jLZqQq).
#
# The brief also says AI tools used on FX Content must not train on user input.
# Transcription, face detection and the audio check run locally. The LLM steps
# (scoring, caption fixes) send transcript text to Gemini. On 2026-09-23 the
# user chose to run them on the free Gemini tier, whose terms say submitted
# content is used to improve Google's models -- i.e. not what the brief asks
# for. The compliant alternatives are a paid Gemini key or a local model.
source_authorization: >-
  Vyro campaign "FX: Adults | S2": FX's limited, revocable licence to create
  derivative works from the FX-provided Adults S2 content for this campaign
  only, per the campaign brief's Terms and Conditions. Source files are from the
  provided "Adults (Edited)" folder. Checked 2026-09-23.

platform_targets: [tiktok]

# Brief: "no longer than 2 minutes and no shorter than 30 seconds".
duration:
  min_seconds: 30
  max_seconds: 120

# Brief: "Mandatory Text ... on screen (or in the caption)". Burned in on screen
# with the brief's wording ("FXX | Hulu"); the caption carries the "Messaging
# Requirements" wording ("FX | Hulu") and the @adultsfx tag. Both are covered.
required_credit_text: "Watch Adults season 2 on FXX | Hulu"
burn_credit_in_video: true
credit_position: top_left
required_caption_text: "Watch Adults season 2 on FX | Hulu @adultsfx"
required_hashtags: ["#AdultsFX", "#fxpartner"]   # required + FTC disclosure
# Brief: "Do not use any logos, hashtags, or content that is not affiliated with
# this campaign" -- so none of the LLM's #comedy / #skit suggestions.
only_required_hashtags: true
# The brief's own example captions ("Here are some examples to use"), for any
# clip the LLM gave no caption.
fallback_captions:
  - "Just a group of adults who have absolutely no idea what they're doing 😭"
  - "Being an adult is really just figuring it out as you go"
  - "Every friend group has at least one person like this 💀"
  - "This is exactly why the group chat can never get leaked 😭"
  - "Nobody prepares you for how unserious adulthood actually is"
  - "Just friends enabling each other's worst decisions 💀"

# Brief: "Do not change the audio of the clip."
keep_original_audio: true

# Brief: "Edits should not misrepresent the original scene" and "Do not
# extrapolate or ideate new plots". The hook line is now written to describe
# only the situation on screen -- no invented outcomes (llm/prompts.py
# HOOK_TEXT_RULES) -- and all three first posts lost most viewers at 0:01 with
# nothing on screen to hold them. On; check each clip's hook against the scene.
hook_overlay: true

# A sitcom: nearly every scene "needs context" by the podcast rubric's standard
# (26 of 48 candidates on episode 201 were dropped for it), yet works as a clip.
scripted: true

# Vyro's content requirements ban "self-harm" content.
forbidden_terms: ["suicide", "suicidal", "kill myself", "killing myself", "self-harm", "self harm"]
mask_profanity_in_captions: true

brand_mentions:
  required: false
  terms: []

language: en
max_clips_per_source: 4

notes: |
  Brief rules the pipeline cannot enforce and you must follow when posting:
  TikTok only; tag @adultsfx; likes and comments on; no paid boosting; music
  only from the TikTok Commercial Library or FX's cues (the pipeline adds none);
  no footage from outside the provided folder. Each post needs 5,000 views to
  qualify; max $1,000 per post.
