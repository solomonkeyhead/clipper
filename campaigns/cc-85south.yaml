# Unpaid growth posts for @solomonkeyclips between paid campaigns, from The
# 85 South Comedy Show (DC Young Fly, Karlous Miller, Chico Bean), whose own
# YouTube channel publishes most full episodes under Creative Commons
# Attribution (CC BY 3.0, YouTube's "reuse allowed" licence). Checked
# 2026-09-26: the channel mixes CC and standard-licence uploads, so every
# video is checked before download (require_license + allowed_channels).
name: cc-85south

source_authorization: >-
  YouTube Creative Commons Attribution licence (reuse allowed, CC BY 3.0), as
  set by the rights holder's official channel "The 85 South Comedy Show"
  (UC4m46pCBkMEyy8gk26WKqbA) on each video clipped; verified per video from
  its own listing before download. Attribution is burned in and in the caption.

# Refuse anything that is not the owner's own CC upload.
require_license: "Creative Commons Attribution"
allowed_channels: ["UC4m46pCBkMEyy8gk26WKqbA", "The 85 South Comedy Show"]

platform_targets: [tiktok]

# Short-form timing (D52): 20-45s preferred, open on the first word, end a
# beat after the last line.
short_form_timing: true
duration:
  min_seconds: 20
  max_seconds: 60

# CC BY: credit the creator, point to the licence, say it was edited.
required_credit_text: "The 85 South Show (CC BY)"
burn_credit_in_video: true
credit_position: top_left
required_caption_text: "Clip from The 85 South Comedy Show on YouTube, CC BY 3.0, edited."
required_hashtags: ["#85southshow"]
only_required_hashtags: false

hook_overlay: true

# The show's audio is not changed; nothing is added under it.
keep_original_audio: true

# The licence covers only what the channel owns: skip moments built on music,
# TV clips or sports footage (Clipper cannot see that; check before posting).
forbidden_terms: ["suicide", "suicidal", "kill myself", "killing myself", "self-harm", "self harm"]
mask_profanity_in_captions: true

brand_mentions:
  required: false
  terms: []

language: en
max_clips_per_source: 5

notes: |
  Not a paid campaign: these posts build the account and the performance log
  (new openings, hooks and length) between Vyro/Whop campaigns. Skip episodes
  titled around music guests, Wild 'N Out, sports (Broken Play) or politics.
