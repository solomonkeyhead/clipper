<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0E12">
<title>Clipper</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  // The computer's light or dark mode, before first paint and whenever it changes (its own switch went, D216).
  try {
    var mode = matchMedia("(prefers-color-scheme: dark)");
    var apply = function () {
      document.documentElement.classList.toggle("dark", mode.matches);
      document.documentElement.classList.toggle("light", !mode.matches);
    };
    apply();
    mode.addEventListener("change", apply);
  } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
